server:
  port: 16900
  tomcat:
    # part 数上限：批量 50 个文件 + sessionId 字段
    max-part-count: 60

spring:
  application:
    name: springagent-gateway
  web:
    resources:
      # 网关托管前端静态文件（相对 gateway 模块的工作目录）
      static-locations: file:../frontend/
      cache:
        cachecontrol:
          max-age: 0
  servlet:
    multipart:
      # 单文件 100MB
      max-file-size: 100MB
      # 请求体上限：批量 50 个文件 + 表单开销
      max-request-size: 5120MB
  datasource:
    # 宿主 18900 → Docker 容器内 MySQL；serverTimezone=UTC 与库中 naive UTC 时间戳对齐
    # characterEncoding 要填 Java 字符集名 UTF-8，不是 MySQL 的 utf8mb4
    url: jdbc:mysql://127.0.0.1:18900/springagent?characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: root   # 开发环境本地值；生产用环境变量覆盖
  data:
    redis:
      # 宿主 19900 → Docker 容器内 Redis 7
      host: 127.0.0.1
      port: 19900
  rabbitmq:
    host: 127.0.0.1
    port: 20900
    # 发布确认：TurnDispatchService 逐条同步等确认；confirm/returns 回调记日志
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费失败不重投（消息进 DLQ，由 DlqListener 告警），避免 poison 消息死循环
        default-requeue-rejected: false

app:
  # 当前应用版本；Docker 构建时由 APP_VERSION 注入
  version: ${APP_VERSION:dev}
  auth:
    access-ttl-seconds: ${AUTH_ACCESS_TTL_SECONDS:3600}
    refresh-ttl-seconds: ${AUTH_REFRESH_TTL_SECONDS:2592000}
  # /internal/** 内部数据面接口的共享静态令牌：Python 引擎经网关切库时带在 X-Internal-Token 头，
  # 与用户登录令牌无关；生产用环境变量 INTERNAL_TOKEN 覆盖
  internal-token: ${INTERNAL_TOKEN:springagent-internal-dev-token-0123456789}
  # 云端数据根目录。
  data-root: ${user.home}/.springagent/cloud
  # 每用户最多可创建的 work 数量
  work-max-works: ${WORK_MAX_WORKS:5}
  # Python 引擎地址，WS 中继（turn/start 回退透传、token 流）仍然需要
  engine-base-url: ${ENGINE_BASE_URL:http://127.0.0.1:15900}
  storage:
    # 孤儿判定宽限期（毫秒）：早于此刻的文件才敢删，排除在途上传
    orphan-grace-ms: ${STORAGE_ORPHAN_GRACE_MS:3600000}
  # 注：邮箱验证码注册（QQ SMTP 账号/授权码/重发间隔/有效期/开关）存 system_settings 表，
  # 由站长在管理后台"系统设置"页配置，即改即生效，不在此配置
