# SpringHarness 入口反代：全部流量转发到网关；/_internal/ 是 X-Accel-Redirect 的本地文件分发点。
# X-Accel-Capable 头是经 Nginx 的标记，网关据此决定返回 X-Accel-Redirect 还是直接吐流（开发直连）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # 请求体上限：批量 50 个文件 + 表单开销
    client_max_body_size 5120m;

    # X-Accel-Redirect 的内部分发点：网关只指路，Nginx 读磁盘发字节；外部不可直接访问
    location /_internal/ {
        internal;
        alias /data/;
    }

    # 聊天 WS：需要 Upgrade 头与长读超时
    location /ws {
        proxy_pass http://host.docker.internal:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Capable nginx;
    }

    location / {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Capable nginx;
    }
}
