# SpringAgent 入口反代：全部流量转发到网关；/_internal/ 是 X-Accel-Redirect 的本地文件分发点。
# X-Accel-Capable 头是经 Nginx 的标记，网关据此决定返回 X-Accel-Redirect 还是直接吐流（开发直连）。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

map "$scheme:$http_x_forwarded_proto" $forwarded_proto {
    default $scheme;
    "http:https" https;
}

server {
    listen 80;
    server_name _;

    # 请求体上限：批量 50 个文件 + 表单开销
    client_max_body_size 5120m;

    # 工作区文件内部分发。
    location /_internal/works/ {
        internal;
        alias /data/cloud/works/;
        disable_symlinks on;
    }

    location /_internal/ {
        return 404;
    }

    # 聊天 WS：需要 Upgrade 头与长读超时
    location /ws {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Capable nginx;
    }

    location / {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Accel-Capable nginx;
    }
}
