# Docker Compose ≥ 2.23.1。默认密码和密钥公开，公网部署建议修改顶部配置。
# 首次部署：docker compose pull && docker compose up -d --wait
# 升级前停止应用并备份 MySQL 和 app-data，禁止使用 down -v。
name: springagent

x-settings:
  mysql-user: &mysql-user "springagent"
  mysql-password: &mysql-password "springagent-mysql"
  mysql-root-password: &mysql-root-password "springagent-mysql"
  rabbitmq-user: &rabbitmq-user "springagent"
  rabbitmq-password: &rabbitmq-password "springagent-rabbitmq"
  jwt-secret: &jwt-secret "springagent-default-jwt-secret-0123456789abcdef"
  internal-token: &internal-token "springagent-default-internal-token-0123456789abcdef"
  web-ports: &web-ports ["17900:80"]
  # 空值表示不启用 HTTPS。
  https-domain: &https-domain ""
  certificate-directory: &certificate-directory "./certs"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: *mysql-root-password
      MYSQL_DATABASE: springagent
      MYSQL_USER: *mysql-user
      MYSQL_PASSWORD: *mysql-password
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_PASSWORD}\" mysql -h 127.0.0.1 -u\"$${MYSQL_USER}\" -D springagent -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --innodb-log-buffer-size=8M
      --innodb-redo-log-capacity=128M
      --max-connections=50
      --table-open-cache=200
      --thread-cache-size=10
      --sort-buffer-size=256K
      --join-buffer-size=256K
      --read-buffer-size=256K
      --read-rnd-buffer-size=256K
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    user: "999:999"
    environment:
      RABBITMQ_DEFAULT_USER: *rabbitmq-user
      RABBITMQ_DEFAULT_PASS: *rabbitmq-password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  springagent:
    image: ghcr.io/radiant303/springagent:latest
    container_name: springagent
    init: true
    stop_grace_period: 120s
    command:
      - /bin/sh
      - -ec
      - |
        echo 'SpringAgent：开始数据库迁移。'
        if alembic upgrade head; then
          echo 'SpringAgent：数据库迁移成功，启动应用。'
        else
          status=$$?
          echo 'SpringAgent：数据库迁移失败，应用未启动。' >&2
          exit "$$status"
        fi
        exec python /app/start.py
    environment:
      MYSQL_USER: *mysql-user
      MYSQL_PASSWORD: *mysql-password
      RABBITMQ_USER: *rabbitmq-user
      RABBITMQ_PASSWORD: *rabbitmq-password
      SPRINGAGENT_CLOUD_DATA_ROOT: /data/cloud
      SPRINGAGENT_CLOUD_JWT_SECRET: *jwt-secret
      SPRINGAGENT_CLOUD_REDIS_URL: redis://redis:6379/0
      SPRINGAGENT_CLOUD_GATEWAY_BASE_URL: http://127.0.0.1:16900
      SPRINGAGENT_CLOUD_INTERNAL_TOKEN: *internal-token
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/springagent?characterEncoding=UTF-8&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: *mysql-user
      SPRING_DATASOURCE_PASSWORD: *mysql-password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: *rabbitmq-user
      SPRING_RABBITMQ_PASSWORD: *rabbitmq-password
      APP_DATA_ROOT: /data/cloud
      ENGINE_BASE_URL: http://127.0.0.1:15900
      JWT_SECRET: *jwt-secret
      INTERNAL_TOKEN: *internal-token
    volumes:
      - app-data:/data/cloud
    healthcheck:
      test: ["CMD", "python", "/app/start.py", "--healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports: *web-ports
    environment:
      HTTPS_DOMAIN: *https-domain
    command:
      - /bin/sh
      - -ec
      - |
        NGINX_SERVER_NAME=_
        NGINX_LISTEN=80
        NGINX_TLS_CONFIG=
        NGINX_HTTP_REDIRECT=
        if [ -n "$$HTTPS_DOMAIN" ]; then
            case "$$HTTPS_DOMAIN" in
                *[!a-zA-Z0-9.-]*|.*|*.|*..*)
                    echo 'HTTPS 域名无效，请只填写域名，不含协议、端口或路径。' >&2
                    exit 1
                    ;;
            esac
            if [ "$${#HTTPS_DOMAIN}" -gt 253 ]; then
                echo 'HTTPS 域名过长。' >&2
                exit 1
            fi
            IFS=.
            set -- $$HTTPS_DOMAIN
            unset IFS
            for label do
                case "$$label" in
                    -*|*-)
                        echo 'HTTPS 域名中的每段不能以连字符开头或结尾。' >&2
                        exit 1
                        ;;
                esac
                if [ "$${#label}" -gt 63 ]; then
                    echo 'HTTPS 域名中的每段不能超过 63 个字符。' >&2
                    exit 1
                fi
            done
            for file in fullchain.pem privkey.pem; do
                if [ ! -s "/etc/nginx/certs/$$file" ] || [ ! -r "/etc/nginx/certs/$$file" ]; then
                    echo "HTTPS 证书文件缺失、为空或不可读：$$file" >&2
                    exit 1
                fi
            done
            NGINX_SERVER_NAME=$$HTTPS_DOMAIN
            NGINX_LISTEN='443 ssl'
            NGINX_TLS_CONFIG='
                ssl_certificate /etc/nginx/certs/fullchain.pem;
                ssl_certificate_key /etc/nginx/certs/privkey.pem;
                ssl_protocols TLSv1.2 TLSv1.3;'
            NGINX_HTTP_REDIRECT="server {
                listen 80;
                server_name $$HTTPS_DOMAIN;
                location = /healthz { access_log off; return 200; }
                location / { return 301 https://$$HTTPS_DOMAIN\$$request_uri; }
            }"
        fi
        export NGINX_SERVER_NAME NGINX_LISTEN NGINX_TLS_CONFIG NGINX_HTTP_REDIRECT
        envsubst '$$NGINX_SERVER_NAME $$NGINX_LISTEN $$NGINX_TLS_CONFIG $$NGINX_HTTP_REDIRECT' \
            < /etc/nginx/springagent.conf.template > /etc/nginx/conf.d/default.conf
        nginx -t
        exec nginx -g 'daemon off;'
    configs:
      - source: nginx-config
        target: /etc/nginx/springagent.conf.template
    volumes:
      - app-data:/data/cloud:ro
      - type: bind
        source: *certificate-directory
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      springagent:
        condition: service_healthy
    restart: unless-stopped

configs:
  nginx-config:
    content: |
      map $$http_upgrade $$connection_upgrade {
          default upgrade;
          "" close;
      }
      map "$$scheme:$$http_x_forwarded_proto" $$forwarded_proto {
          default $$scheme;
          "http:https" https;
      }
      $$NGINX_HTTP_REDIRECT
      server {
          listen $$NGINX_LISTEN;
          server_name $$NGINX_SERVER_NAME;
          $$NGINX_TLS_CONFIG
          client_max_body_size 5120m;
          location = /healthz {
              access_log off;
              return 200;
          }
          location /_internal/works/ {
              internal;
              alias /data/cloud/works/;
              disable_symlinks on;
          }
          location /_internal/ {
              return 404;
          }
          location /ws {
              proxy_pass http://springagent:16900;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection $$connection_upgrade;
              proxy_read_timeout 3600s;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Proto $$forwarded_proto;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Accel-Capable nginx;
          }
          location / {
              proxy_pass http://springagent:16900;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-Proto $$forwarded_proto;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Accel-Capable nginx;
          }
      }

networks:
  default:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  app-data:
