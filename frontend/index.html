<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SpringAgent</title>
  <link rel="icon" type="image/png" href="/static/assets/images/log.png">
  <script>
    /* 未登录直接去登录页，避免先闪出聊天界面 */
    try { if (!localStorage.getItem("sa.token")) location.replace("/static/login.html"); } catch (e) { /* 存储不可用时交给 index.js 处理 */ }
  </script>
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/ui.css">
  <link rel="stylesheet" href="/static/css/components/dialog.css">
  <link rel="stylesheet" href="/static/css/components/skeleton.css">
  <link rel="stylesheet" href="/static/css/components/controls.css">
  <link rel="stylesheet" href="/static/css/components/sprout.css">
  <link rel="stylesheet" href="/static/css/components/glass.css">
  <noscript>
    <style>
      .glass {
        background: rgba(255, 255, 255, 0.5) !important;
        -webkit-backdrop-filter: blur(14px) !important;
        backdrop-filter: blur(14px) !important;
      }
    </style>
  </noscript>
  <link rel="stylesheet" href="/static/vendor/prism.css">
  <link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
  <link rel="stylesheet" href="/static/css/components/markdown.css">
  <link rel="stylesheet" href="/static/css/pages/chat.css">
</head>
<body>
  <div id="app" class="is-view-loading">
    <aside id="sidebar">
      <div class="sidebar-head">
        <img class="brand-logo" src="/static/assets/images/log.png" alt="SpringAgent" title="SpringAgent">
        <button id="toggle-sidebar" class="sb-icon-btn" title="收起侧栏" aria-label="收起侧栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
        </button>
      </div>
      <div class="sidebar-top">
        <button id="new-session-btn" class="new-session-btn">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M 12 2.1 C 6.532 2.1 2.1 6.532 2.1 12 C 2.1 13.923 2.649 15.719 3.598 17.239 L 2.517 19.821 C 2.104 20.809 2.829 21.9 3.901 21.9 L 12 21.9 C 17.468 21.9 21.9 17.468 21.9 12 C 21.9 6.532 17.468 2.1 12 2.1 Z M 3.9 12 C 3.9 7.526 7.526 3.9 12 3.9 C 16.473 3.9 20.1 7.526 20.1 12 C 20.1 16.473 16.473 20.1 11.999 20.1 L 4.352 20.1 L 5.635 17.035 C 5.635 17.035 5.352 16.629 5.352 16.629 C 4.437 15.317 3.9 13.723 3.9 12 Z" fill="currentColor" fill-opacity="0.902" fill-rule="evenodd"/><g class="nb-plus"><path d="M 12 7.5 L 12 16.5 M 7.5 12 L 16.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g></svg></span>
          <span class="nb-label">新建会话</span>
          <span class="kbd"><kbd>Ctrl</kbd><kbd>K</kbd></span>
        </button>
      </div>
      <!-- 项目与对话共用一个滚动区，底部渐隐 -->
      <div id="sidebar-scroll">
        <div class="sb-section-title">项目</div>
        <button id="new-work-btn" class="sb-item" type="button">
          <svg class="sb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12.5V9a2 2 0 0 0-2-2h-6.6l-2-2.5H5.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h7"/><path d="M18 15v6M15 18h6"/></svg>
          <span>新建项目</span>
        </button>
        <!-- 列表首屏为骨架行，数据到达后由 JS 整体替换（index.js 也会克隆它用于切换项目时的重新加载） -->
        <div id="works">
          <div class="sk-block sk-list sk-fade" aria-hidden="true">
            <div class="sk-row"><span class="sk sk-ic"></span><span class="sk" style="--w:64%"></span></div>
            <div class="sk-row"><span class="sk sk-ic"></span><span class="sk" style="--w:46%"></span></div>
            <div class="sk-row"><span class="sk sk-ic"></span><span class="sk" style="--w:56%"></span></div>
          </div>
        </div>
        <div class="sb-section-title">对话</div>
        <div id="session-list">
          <div class="sk-block sk-list sk-fade" aria-hidden="true">
            <div class="sk-row"><span class="sk" style="--w:72%"></span></div>
            <div class="sk-row"><span class="sk" style="--w:58%"></span></div>
            <div class="sk-row"><span class="sk" style="--w:80%"></span></div>
            <div class="sk-row"><span class="sk" style="--w:50%"></span></div>
            <div class="sk-row"><span class="sk" style="--w:66%"></span></div>
            <div class="sk-row"><span class="sk" style="--w:44%"></span></div>
          </div>
        </div>
      </div>
      <div class="sidebar-footer">
        <a id="update-notice" class="points-card update-card hidden" href="https://github.com/Radiant303/SpringAgent/releases/latest" target="_blank" rel="noopener">

            <style>
              @keyframes jk-spin { to { transform: rotate(360deg); } }
              .build-status-spin {
                animation: jk-spin 1.7s linear infinite;
                transform-origin: center;
                transform-box: view-box;
              }
              @media (prefers-reduced-motion: reduce) {
                .build-status-spin { animation: none; }
              }
            </style>
            <g class="build-status-spin" fill="none" fill-rule="evenodd" stroke="currentColor">
              <g transform="translate(19 19) scale(0.95) translate(-20 -20)">
                <g transform="translate(1 1)" stroke-width="3">
                  <circle stroke-opacity=".4" cx="19" cy="19" r="18"/>
                  <path d="M37 19c0-9.94-8.06-18-18-18"/>
                </g>
              </g>
            </g>
            <g transform="translate(19 19) scale(0.045) translate(-256 -256)">
              <path d="M112 244l144-144 144 144M256 120v292" fill="none" stroke="currentColor" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
          </svg>
          <span class="pc-text">
            <span class="pc-title">版本更新</span>
            <span class="pc-sub" id="update-version"></span>
          </span>
          <svg class="pc-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </a>
        <a id="points-card" class="points-card hidden" href="/static/admin.html#points">
          <svg class="pc-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="7.5" ry="3"/><path d="M4.5 7v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3V7"/><path d="M4.5 12v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5"/></svg>
          <span class="pc-text">
            <span class="pc-title" id="points-value">积分 <span class="sk" style="--w:56px;--h:12px"></span></span>
            <span class="pc-sub">查看账单与用量</span>
          </span>
          <svg class="pc-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>

        <div id="user-menu" class="user-menu hidden" role="menu">
          <a class="um-item" href="/static/admin.html#account" role="menuitem">

            <svg viewBox="0 0 192 192" fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="round" aria-hidden="true"><path d="M153.933 114.718c-2.953-9.509-6.349-17.5-11.573-30.58C143.172 49.786 128.922 22 96.101 22c-33.189 0-47.125 28.34-46.24 62.139-5.241 13.097-8.62 21.033-11.573 30.579-6.276 20.256-4.246 28.636-2.695 28.821 3.323.407 12.94-15.243 12.94-15.243 0 9.064 4.651 20.886 14.73 29.413-4.873 1.499-15.82 5.532-13.217 9.953 2.105 3.57 36.217 2.275 46.056 1.165 9.838 1.11 43.95 2.405 46.055-1.165 2.602-4.403-8.362-8.454-13.217-9.953 10.078-8.546 14.73-20.367 14.73-29.413 0 0 9.617 15.65 12.94 15.243 1.569-.203 3.6-8.583-2.677-28.821Z"/></svg>
            <span>官方社群</span>

            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
            <span>项目地址</span>
          </a>
          <a class="um-item" id="um-settings" href="/static/admin.html" role="menuitem">
            <svg viewBox="0 0 1024 1024" fill="currentColor" aria-hidden="true"><path d="M677.4784 524.288a165.4784 165.4784 0 1 0-330.9568 0 165.4784 165.4784 0 0 0 330.9568 0z m-74.46528 0a91.01312 91.01312 0 1 1-182.0672 0 91.01312 91.01312 0 0 1 182.0672 0z"/><path d="M426.43456 925.696a80.6912 80.6912 0 0 1-57.5488-45.38368l-17.69472-38.33856c-7.61856-16.46592-26.13248-26.66496-45.8752-24.61696l-43.33568 4.5056a82.24768 82.24768 0 0 1-68.52608-24.73984 402.80064 402.80064 0 0 1-51.32288-67.29728 393.46176 393.46176 0 0 1-35.47136-76.22656 77.53728 77.53728 0 0 1 12.4928-72.37632l25.76384-33.5872a37.84704 37.84704 0 0 0 0-46.6944l-25.96864-33.87392a77.49632 77.49632 0 0 1-12.36992-72.704A405.54496 405.54496 0 0 1 193.3312 251.61728a82.24768 82.24768 0 0 1 68.68992-24.90368l43.29472 4.5056c19.74272 2.048 38.25664-8.192 45.8752-24.576l17.57184-38.0928a80.73216 80.73216 0 0 1 57.38496-45.34272 444.98944 444.98944 0 0 1 171.37664-0.36864 80.6912 80.6912 0 0 1 57.58976 45.42464l17.69472 38.33856c7.61856 16.46592 26.13248 26.66496 45.8752 24.61696l43.33568-4.5056a82.24768 82.24768 0 0 1 68.52608 24.73984c19.6608 20.8896 36.78208 43.29472 51.32288 67.29728 14.49984 24.00256 26.29632 49.43872 35.47136 76.22656a77.53728 77.53728 0 0 1-12.4928 72.37632l-25.76384 33.5872a37.84704 37.84704 0 0 0 0 46.6944l25.96864 33.83296c15.9744 20.80768 21.01248 48.00512 12.36992 72.74496a405.504 405.504 0 0 1-86.75328 142.7456 82.24768 82.24768 0 0 1-68.68992 24.90368l-43.29472-4.5056c-19.74272-2.048-38.25664 8.192-45.8752 24.576l-17.57184 38.0928a80.73216 80.73216 0 0 1-57.38496 45.34272c-56.85248 11.264-115.0976 11.34592-171.4176 0.36864z m156.95872-73.35936a6.3488 6.3488 0 0 0 4.25984-3.56352l17.57184-38.05184c21.0944-45.71136 70.16448-72.74496 121.15968-67.46112l43.29472 4.5056c3.03104 0.32768 5.57056-0.57344 6.5536-1.6384a331.03872 331.03872 0 0 0 70.8608-116.49024c0.12288-0.32768-0.04096-1.4336-1.14688-2.8672l-25.92768-33.792a112.31232 112.31232 0 0 1 0-137.37984l25.72288-33.5872c             <span>设置</span>
          </a>
          <button class="um-item" id="logout-btn" type="button" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 20.5H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h3.5"/><path d="M15.5 16.5L20 12l-4.5-4.5M20 12H9.5"/></svg>
            <span>退出登录</span>
          </button>
        </div>
        <div id="user-chip" class="user-chip hidden" title="账号与管理" aria-haspopup="menu">
          <img class="user-avatar" src="/static/assets/images/user_image.png" alt="头像">
          <span id="user-name"></span>
          <span class="user-badge" id="user-badge"></span>
          <svg class="uc-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 10l4-4 4 4M8 14l4 4 4-4"/></svg>
        </div>
      </div>
    </aside>
    <button id="sidebar-backdrop" type="button" aria-label="关闭侧栏" tabindex="-1"></button>

    <main id="main">
      <header id="topbar">
        <img id="collapsed-brand" class="brand-logo" src="/static/assets/images/log.png" alt="SpringAgent">
        <div id="collapsed-actions">
          <button id="expand-sidebar" class="sb-icon-btn" title="展开侧栏" aria-label="展开侧栏" aria-controls="sidebar" aria-expanded="false">
            <svg class="desktop-sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg>
            <svg class="mobile-menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
          </button>
          <button id="mobile-new-session" class="sb-icon-btn" type="button" title="新建会话" aria-label="新建会话">
            <svg viewBox="0 0 24 24"><path d="M 12 2.1 C 6.532 2.1 2.1 6.532 2.1 12 C 2.1 13.923 2.649 15.719 3.598 17.239 L 2.517 19.821 C 2.104 20.809 2.829 21.9 3.901 21.9 L 12 21.9 C 17.468 21.9 21.9 17.468 21.9 12 C 21.9 6.532 17.468 2.1 12 2.1 Z M 3.9 12 C 3.9 7.526 7.526 3.9 12 3.9 C 16.473 3.9 20.1 7.526 20.1 12 C 20.1 16.473 16.473 20.1 11.999 20.1 L 4.352 20.1 L 5.635 17.035 C 5.635 17.035 5.352 16.629 5.352 16.629 C 4.437 15.317 3.9 13.723 3.9 12 Z" fill="currentColor" fill-opacity="0.902" fill-rule="evenodd"/><g class="nb-plus"><path d="M 12 7.5 L 12 16.5 M 7.5 12 L 16.5 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g></svg>
          </button>
        </div>
        <span id="breadcrumb"><span id="session-title"></span></span>
        <span id="model-topbar-slot"></span>
        <span class="spacer"></span>
      </header>

      <!-- 首屏为加载转圈：历史加载完成前不判定“空会话”，避免先闪出首页字标再跳成消息列表 -->
      <div id="messages">
        <div class="sk-block msg-skeleton" role="status" aria-busy="true" aria-label="正在加载对话">
          <span class="chat-spinner"></span>
        </div>
      </div>

      <footer id="input-area">
        <!-- 空会话首页：字标 + 居中输入框（#main.is-empty 时显示） -->
        <div id="hero" aria-hidden="true">SPRINGAGENT</div>

        <div id="plan-dock" class="hidden">
          <div id="plan-panel" class="hidden">
            <div id="plan-header" title="收起">
              <svg class="plan-head-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.1 6C4.1 5.5 4.5 5.1 5 5.1H19C19.5 5.1 19.9 5.5 19.9 6C19.9 6.5 19.5 6.9 19 6.9H5C4.5 6.9 4.1 6.5 4.1 6ZM4.1 12C4.1 11.5 4.5 11.1 5 11.1H19C19.5 11.1 19.9 11.5 19.9 12C19.9 12.5 19.5 12.9 19 12.9H5C4.5 12.9 4.1 12.5 4.1 12ZM4.1 18C4.1 17.5 4.5 17.1 5 17.1H19C19.5 17.1 19.9 17.5 19.9 18C19.9 18.5 19.5 18.9 19 18.9H5C4.5 18.9 4.1 18.5 4.1 18Z" fill="currentColor"/></svg>
              <span class="plan-title">当前进度</span>
              <span id="plan-progress"></span>
              <span class="spacer"></span>
              <span class="plan-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
            </div>
            <ul id="plan-items"></ul>
          </div>
          <button id="plan-pill" type="button" aria-pressed="false" title="展开/收起">
            <svg class="plan-head-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.1 6C4.1 5.5 4.5 5.1 5 5.1H19C19.5 5.1 19.9 5.5 19.9 6C19.9 6.5 19.5 6.9 19 6.9H5C4.5 6.9 4.1 6.5 4.1 6ZM4.1 12C4.1 11.5 4.5 11.1 5 11.1H19C19.5 11.1 19.9 11.5 19.9 12C19.9 12.5 19.5 12.9 19 12.9H5C4.5 12.9 4.1 12.5 4.1 12ZM4.1 18C4.1 17.5 4.5 17.1 5 17.1H19C19.5 17.1 19.9 17.5 19.9 18C19.9 18.5 19.5 18.9 19 18.9H5C4.5 18.9 4.1 18.5 4.1 18Z" fill="currentColor"/></svg>
            <span>当前进度</span>
            <span id="plan-pill-count"></span>
          </button>
        </div>

        <div id="context-status" class="hidden" role="status" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span id="context-status-text"></span>
        </div>

        <div id="input-stage">
          <div id="input-card">
            <button id="scroll-bottom" class="glass hidden" type="button" data-glass data-radius="999" data-bezel="16" data-rim="9" data-mag="0.09" title="显示最新消息" aria-label="显示最新消息">
              <svg class="sb-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16m0 0-6-6m6 6 6-6"/></svg>
            </button>
            <div id="input" class="is-empty" contenteditable="true" role="textbox" aria-multiline="true" aria-label="输入消息" enterkeyhint="send"
                 data-placeholder="输入消息，Enter 发送，Shift+Enter 换行，Esc 中断运行"></div>
            <div id="input-toolbar">
              <button id="upload-btn" class="tool-btn" type="button" title="上传图片" aria-label="上传图片">
                <svg class="desktop-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                <svg class="mobile-upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <input type="file" id="upload-input" class="hidden" aria-hidden="true" accept="image/png,image/jpeg,image/gif,image/webp" multiple>
              <span class="spacer"></span>
              <span id="usage">
                <svg id="usage-ring" viewBox="0 0 24 24" aria-hidden="true">
                  <circle class="ring-track" cx="12" cy="12" r="9"/>
                  <circle id="usage-ring-prog" class="ring-prog" cx="12" cy="12" r="9"/>
                </svg>
                <span id="usage-tip" role="tooltip">上下文用量</span>
              </span>
              <div id="model-pill">
                <button id="model-btn" type="button" title="模型与思考强度" aria-label="选择模型与思考强度" aria-expanded="false" aria-controls="model-menu" aria-haspopup="menu">
                  <span id="model-name"></span>
                  <span id="model-effort" class="hidden"><span class="model-separator" aria-hidden="true">·</span><span id="effort-name"></span></span>
                  <span class="model-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
                </button>
                <div id="model-menu" class="hidden">
                  <div id="model-list" class="model-menu-list" role="menu" aria-label="模型"></div>
                  <div id="effort-section" class="hidden">
                    <button id="effort-btn" class="model-item model-effort-row" type="button" aria-label="选择思考强度" aria-haspopup="menu" aria-expanded="false" aria-controls="effort-menu">
                      <span class="model-item-name">思考强度</span>
                      <span id="effort-value" class="model-menu-value"></span>
                      <svg class="model-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
                    </button>
                  </div>
                </div>
                <div id="effort-menu" class="hidden" role="menu" aria-label="思考强度"></div>
              </div>
              <span id="send-control">
                <button id="send-btn" class="round-btn" title="发送" aria-label="发送">
                  <svg viewBox="0 0 1024 1024"><path d="M705.536 433.664a38.4 38.4 0 1 1-54.272 54.272L550.4 387.114667V729.6a38.4 38.4 0 0 1-76.8 0V387.114667l-100.864 100.821333a38.4 38.4 0 1 1-54.272-54.272l166.4-166.4a38.4 38.4 0 0 1 54.272 0l166.4 166.4z" fill="currentColor"/></svg>
                </button>
                <button id="stop-btn" class="round-btn hidden" title="停止" aria-label="停止" inert>
                  <svg viewBox="0 0 1024 1024"><path d="M331.946667 379.904c-11.946667 23.466667-11.946667 54.186667-11.946667 115.626667v32.938666c0 61.44 0 92.16 11.946667 115.626667 10.538667 20.650667 27.306667 37.418667 47.957333 47.957333 23.466667 11.946667 54.186667 11.946667 115.626667 11.946667h32.938666c61.44 0 92.16 0 115.626667-11.946667 20.650667-10.538667 37.418667-27.306667 47.957333-47.957333 11.946667-23.466667 11.946667-54.186667 11.946667-115.626667v-32.938666c0-61.44 0-92.16-11.946667-115.626667a109.696 109.696 0 0 0-47.957333-47.957333c-23.466667-11.946667-54.186667-11.946667-115.626667-11.946667h-32.938666c-61.44 0-92.16 0-115.626667 11.946667-20.650667 10.538667-37.418667 27.306667-47.957333 47.957333z" fill="currentColor"/></svg>
                </button>
              </span>
            </div>
          </div>

          <!-- 输入框下方的托盘：当前项目 + 连接状态 -->
          <div id="input-tray">
            <span id="input-ws" class="tray-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7a2 2 0 0 1 2-2h3.8l2 2.2h7.2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>
              <span id="input-ws-name"></span>
            </span>
            <span class="spacer"></span>
            <span class="tray-item tray-conn">
              <span id="conn-status" class="conn-dot connecting" title="连接中"></span>
              <span id="conn-text">连接中…</span>
              <button id="reconnect-btn" class="hidden" type="button">重新连接</button>
            </span>
          </div>

          <!-- Agent 提问卡：到达时顶替输入卡片的位置，不再全屏遮罩 -->
          <div id="question-card" class="hidden" inert>
            <div id="question-head">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></span>
              <span id="question-text"></span>
              <span class="spacer"></span>
              <button id="question-close" class="icon-btn" title="放弃 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div id="question-options"></div>
            <div id="question-custom-row" class="hidden">
              <span class="q-opt-label">其他</span>
              <input id="question-custom" type="text" placeholder="说说你的想法…">
              <span class="q-num" id="question-custom-num"></span>
            </div>
            <div id="question-actions" class="hidden">
              <button id="question-cancel">放弃 <span class="q-kbd">Esc</span></button>
              <button id="question-submit" class="btn-primary">提交 <span class="q-kbd">Enter</span></button>
            </div>
          </div>

          <!-- 工具审批卡：与提问卡一致，顶替输入卡片的位置 -->
          <div id="approval-card" class="hidden" tabindex="-1" inert>
            <div id="approval-head">
              <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5.5c0 4.3-2.9 7.9-7 9.5-4.1-1.6-7-5.2-7-9.5V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
              <span id="approval-tool"></span>
              <span class="spacer"></span>
              <button id="approval-close" class="icon-btn" title="拒绝 (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <pre id="approval-args"></pre>
            <pre id="approval-diff" class="diff hidden"></pre>
            <div id="approval-actions">
              <button id="approval-reject">拒绝 <span class="q-kbd">Esc</span></button>
              <button id="approval-approve" class="btn-primary">批准 <span class="q-kbd">Enter</span></button>
            </div>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <script src="/static/vendor/katex/katex.min.js"></script>
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/js/components/glass.js"></script>
  <script type="module" src="/static/js/pages/index.js"></script>
</body>
</html>
