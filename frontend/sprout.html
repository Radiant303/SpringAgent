<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小芽团子 - SpringAgent</title>
  <link rel="icon" type="image/png" href="/static/assets/images/log.png">
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; background: #f4f4ee; }
    canvas {
      width: min(80vmin, 512px);
      height: min(80vmin, 512px);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      border-radius: 16px;
    }
    canvas:focus { outline: none; }
    canvas:focus-visible { outline: 2px solid #9dc577; outline-offset: 4px; }
  </style>
</head>
<body>
  <canvas id="c" tabindex="0" role="button"
    aria-label="一个头顶小芽、会呼吸和眨眼的绿色团子，点击或按回车戳它一下"></canvas>
  <script type="module">
    import { SproutPet } from "/static/js/components/sprout.js";
    const canvas = document.getElementById("c");
    const pet = new SproutPet(canvas, { contentSpan: 420 });
    pet.setInteractive(true);
  </script>
</body>
</html>
