<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - Spring Harness</title>
  <link rel="icon" type="image/svg+xml" href="/static/assets/images/sprout.svg">
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/ui.css">
  <link rel="stylesheet" href="/static/css/pages/login.css">
</head>
<body class="login-page">
  <!-- 品牌标固定在页面左上角（页面式布局，不套卡片） -->
  <header class="login-topbar">
    <img class="login-logo" src="/static/assets/images/log.png" alt="">
    <span class="login-brand">SPRING HARNESS</span>
  </header>

  <main class="login-wrap">
    <form id="login-form" class="login-form" novalidate>
      <h1 id="login-title" class="login-title">登录</h1>
      <p class="login-switch">
        <span id="login-switch-text">没有账号？</span>
        <a id="login-switch-link" href="#register">注册</a>
        <!-- 忘记密码：仅登录模式且站长开启邮箱验证码功能时出现 -->
        <a id="login-forgot-link" class="hidden" href="#reset">忘记密码？</a>
      </p>
      <!-- 从主站被动跳转过来时（登录过期 / 账号禁用）说明原因；重置密码成功也复用它提示 -->
      <div id="login-notice" class="login-notice hidden" role="status"></div>

      <div class="login-field no-reset">
        <label class="login-label" for="login-username">用户名</label>
        <div class="login-control">
          <input id="login-username" name="username" type="text" placeholder="请输入用户名"
                 autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="64">
        </div>
      </div>

      <div class="login-field no-reset">
        <label class="login-label" for="login-password">密码</label>
        <div class="login-control has-eye">
          <input id="login-password" name="password" type="password" placeholder="请输入密码（至少 6 位）"
                 autocomplete="current-password">
          <button type="button" class="login-eye" data-eye="login-password"
                  aria-label="显示密码" aria-pressed="false"></button>
        </div>
      </div>

      <div class="login-field code-fields">
        <label class="login-label" for="login-email">QQ 邮箱</label>
        <div class="login-control">
          <input id="login-email" name="email" type="email" placeholder="注册时验证过的 QQ 邮箱"
                 autocomplete="email" autocapitalize="off" spellcheck="false" maxlength="128">
        </div>
      </div>

      <div class="login-field code-fields">
        <label class="login-label" for="login-code">邮箱验证码</label>
        <div class="login-control has-btn">
          <input id="login-code" name="code" type="text" placeholder="6 位数字验证码"
                 inputmode="numeric" autocomplete="one-time-code" maxlength="6">
          <button type="button" id="login-send-code" class="login-code-btn">获取验证码</button>
        </div>
      </div>

      <div class="login-field register-only">
        <label class="login-label" for="login-password2">确认密码</label>
        <div class="login-control has-eye">
          <input id="login-password2" name="password2" type="password" placeholder="请再次输入密码"
                 autocomplete="new-password">
          <button type="button" class="login-eye" data-eye="login-password2"
                  aria-label="显示密码" aria-pressed="false"></button>
        </div>
      </div>

      <div class="login-field reset-only">
        <label class="login-label" for="login-new-password">新密码</label>
        <div class="login-control has-eye">
          <input id="login-new-password" name="newPassword" type="password" placeholder="请输入新密码（至少 6 位）"
                 autocomplete="new-password">
          <button type="button" class="login-eye" data-eye="login-new-password"
                  aria-label="显示密码" aria-pressed="false"></button>
        </div>
      </div>

      <div class="login-field reset-only">
        <label class="login-label" for="login-new-password2">确认新密码</label>
        <div class="login-control has-eye">
          <input id="login-new-password2" name="newPassword2" type="password" placeholder="请再次输入新密码"
                 autocomplete="new-password">
          <button type="button" class="login-eye" data-eye="login-new-password2"
                  aria-label="显示密码" aria-pressed="false"></button>
        </div>
      </div>

      <div id="login-error" class="login-error" role="alert"></div>

      <button id="login-submit" type="submit" class="login-primary">登录</button>
    </form>
  </main>

  <footer class="login-footer">
    <a href="https://github.com/Radiant303/SpringHarness" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.226 17.284c-2.965-.36-5.054-2.493-5.054-5.256 0-1.123.404-2.336 1.078-3.144-.292-.741-.247-2.314.09-2.965.898-.112 2.111.36 2.83 1.01.853-.269 1.752-.404 2.853-.404 1.1 0 1.999.135 2.807.382.696-.629 1.932-1.1 2.83-.988.315.606.36 2.179.067 2.942.72.854 1.101 2 1.101 3.167 0 2.763-2.089 4.852-5.098 5.234.763.494 1.28 1.572 1.28 2.807v2.336c0 .674.561 1.056 1.235.786 4.066-1.55 7.255-5.615 7.255-10.646C23.5 6.188 18.334 1 11.978 1 5.62 1 .5 6.188.5 12.545c0 4.986 3.167 9.12 7.435 10.669.606.225 1.19-.18 1.19-.786V20.63a2.9 2.9 0 0 1-1.078.224c-1.483 0-2.359-.808-2.987-2.313-.247-.607-.517-.966-1.034-1.033-.27-.023-.359-.135-.359-.27 0-.27.45-.471.898-.471.652 0 1.213.404 1.797 1.235.45.651.921.943 1.483.943.561 0 .92-.202 1.437-.719.382-.381.674-.718.944-.943"/></svg>
      <span>项目地址</span>
    </a>
  </footer>

  <script type="module" src="/static/js/pages/login.js"></script>
</body>
</html>
