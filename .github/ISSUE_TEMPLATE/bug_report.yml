name: 缺陷报告
description: 报告可复现的功能缺陷或异常行为
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请提供可复现的信息。日志和截图中请移除密码、API Key、令牌及个人数据。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 v0.1.34；本地开发可填写提交哈希
      placeholder: v0.1.34
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: 运行环境
      options:
        - Docker 部署
        - 本地开发
        - 其他环境
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 从初始状态开始，列出最小且完整的操作步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 包括错误提示、状态码或异常表现
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 可粘贴相关日志或拖入截图；请先移除敏感信息
