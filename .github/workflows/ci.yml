name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run --frozen pytest -q

  gateway-tests:
    name: Gateway tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: springagent
        ports:
          - "18900:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=30s
      redis:
        image: redis:7
        ports:
          - "19900:6379"
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: springagent
          RABBITMQ_DEFAULT_PASS: springagent
        ports:
          - "20900:5672"
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      SPRINGAGENT_CONFIG: ${{ github.workspace }}/config.toml.example
      SPRINGAGENT_CLOUD_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:18900/springagent?charset=utf8mb4
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:18900/springagent?characterEncoding=UTF-8&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: 127.0.0.1
      SPRING_DATA_REDIS_PORT: 19900
      SPRING_RABBITMQ_HOST: 127.0.0.1
      SPRING_RABBITMQ_PORT: 20900
      SPRING_RABBITMQ_USERNAME: springagent
      SPRING_RABBITMQ_PASSWORD: springagent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install migration dependencies
        run: uv sync --frozen

      - name: Initialize database
        run: uv run --frozen alembic upgrade head

      - name: Run gateway tests
        working-directory: gateway
        run: bash ./mvnw -B test

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find . -type f -name '*.js' -print0)

      - name: Validate SVG assets
        working-directory: frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in Path('assets').rglob('*.svg'):
              ET.parse(path)
              print(f'Validated {path}')
          PY
