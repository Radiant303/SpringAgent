[project]
name = "springagent"
version = "0.1.0"
description = "SpringAgent 云端 Agent 平台"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5",
    "alembic>=1.16",
    "bcrypt>=4.3",
    "cryptography>=50.0.1",
    "exa-py==2.25.0",
    "fastapi>=0.121",
    "httpx>=0.28",
    "loguru>=0.7.3",
    "pydantic-ai[anthropic,google-genai,openai]>=2.57.0",
    "pydantic-ai-harness[codemode,skills,temporal]>=0.24.0",
    "pyjwt>=2.10",
    "pymysql>=1.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "tavily-python==0.8.5",
    "tiktoken>=0.14",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spring_agent"]

[project.scripts]
springagent = "spring_agent.entrypoints.cloud:main"
