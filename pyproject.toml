[project]
name = "spring-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.5",
    "alembic>=1.16",
    "bcrypt>=4.3",
    "fastapi>=0.121",
    "httpx>=0.28",
    "loguru>=0.7.3",
    "pydantic-ai[anthropic,google-genai,openai]>=2.57.0",
    "pydantic-ai-harness[codemode,skills,temporal]>=0.24.0",
    "pyjwt>=2.10",
    "pymysql>=1.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spring_harness"]

[project.scripts]
springcloud = "spring_harness.entrypoints.cloud:main"
